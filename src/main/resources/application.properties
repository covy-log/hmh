spring.application.name=hmh
spring.config.import=classpath:schedule.properties
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

server.port=${PORT:8080}

# ── 세션 ────────────────────────────────────────────────
# 세션 저장소를 DB(SPRING_SESSION 테이블)로 지정.
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never

# 서버 세션 만료: 무활동 7일
server.servlet.session.timeout=7d
# 쿠키 만료: 7일. 이 값이 없으면 JSESSIONID 가 세션 쿠키로 남아 브라우저를 닫는 순간 사라진다.
server.servlet.session.cookie.max-age=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Aiven PostgreSQL DB ?? ?? (sslmode=require ??)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.hmh.domain, com.hmh.dto
mybatis.configuration.map-underscore-to-camel-case=true

# Google OAuth2 로그인 (client-id/secret은 환경변수로 주입)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# 카카오 로그인 (client-id/secret은 환경변수로 주입, REST API 키/시크릿 사용)
# 카카오는 스프링 시큐리티의 common-provider가 아니라서 provider 정보를 직접 명시해야 함
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname
spring.security.oauth2.client.registration.kakao.client-name=Kakao

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# 1. P6Spy 로깅 명시적 활성화
decorator.datasource.p6spy.enable-logging=true
# 2. 쿼리를 보기 좋게 여러 줄로 출력 (권장)
decorator.datasource.p6spy.multiline=true
# 3. P6Spy의 로그 레벨 설정 (스프링 부트 로거가 이걸 콘솔에 뿌려주도록 INFO 설정)
logging.level.p6spy=INFO