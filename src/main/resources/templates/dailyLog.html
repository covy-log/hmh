<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일일 루틴</title>
    <link rel="stylesheet" th:href="@{/css/routine.css}" href="/css/routine.css">
    <script th:src="@{/js/dialog.js}" src="/js/dialog.js"></script>
</head>
<body>

<div class="page-wrapper">

    <!-- ── User Bar ── -->
    <div class="user-bar">
        <div class="user-profile">
            <span class="user-name" th:text="${name}">이름</span>
            <button type="button" class="profile-btn" id="profileBtn" onclick="toggleProfileMenu(event)" title="마이페이지">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/>
                    <path d="M4 20c0-4 3.582-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <div class="profile-dropdown" id="profileDropdown">
                <button type="button" class="dropdown-item" disabled>마이페이지</button>
                <button type="button" class="dropdown-item" th:if="${isAdmin}" onclick="location.href='/admin'">관리 페이지</button>
                <button type="button" class="dropdown-item" th:if="${isAdmin}" onclick="runDaemon('RoutineCycleDaemon', 'routine-cycle')">RoutineCycleDaemon 실행</button>
                <button type="button" class="dropdown-item" th:if="${isAdmin}" onclick="runDaemon('DailyLogDaemon', 'daily-log')">DailyLogDaemon 실행</button>
                <button type="button" class="dropdown-item" onclick="logout()">로그아웃</button>
            </div>
        </div>
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="테마 전환">🌙</button>
    </div>

    <!-- ── Top Navigation ── -->
    <nav class="top-nav">
        <div class="nav-tabs">
            <button type="button" class="nav-btn active">일일 루틴</button>
            <button type="button" class="nav-btn" onclick="location.href='/routineCycleStatus'">루틴 현황</button>
            <button type="button" class="nav-btn" onclick="location.href='/routineSetting'">루틴 설정</button>
        </div>
    </nav>

    <!-- ── Stats Cards ── -->
    <div class="stats-grid">
        <div class="stat-card stat-done">
            <div class="stat-label">완료</div>
            <div class="stat-value" id="completedCountView"
                 th:text="${completedCount != null ? completedCount : 0}">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">전체</div>
            <div class="stat-value" id="totalCountView"
                 th:text="${totalCount != null ? totalCount : 0}">0</div>
        </div>
        <div class="stat-card stat-rate">
            <div class="stat-label">달성률</div>
            <div class="stat-value" id="achievementRateView"
                 th:text="${achievementRate != null ? achievementRate : 0} + '%'">0%</div>
        </div>
    </div>

    <!-- ── Today's Routine List ── -->
    <h2 class="section-title">오늘의 루틴</h2>

    <div class="list-card">
        <table class="routine-table">
            <thead>
            <tr>
                <th class="check-cell">상태</th>
                <th>루틴명</th>
                <th class="value-cell">달성 수치</th>
            </tr>
            </thead>
            <tbody>

            <!-- Empty state -->
            <tr th:if="${#lists.isEmpty(dailyLogDtoList)}" id="emptyMessageRow">
                <td colspan="3">
                    <div class="empty-state">
                        <span class="empty-icon">🗓️</span>
                        아직 설정된 루틴이 없어요.<br>
                        <b>'루틴 설정'</b> 탭에서 새로운 루틴을 추가해 보세요.
                    </div>
                </td>
            </tr>

            <!-- Routine rows -->
            <tr th:unless="${#lists.isEmpty(dailyLogDtoList)}"
                th:each="dailyLogDto : ${dailyLogDtoList}"
                th:data-seq-no="${dailyLogDto.seqNo}"
                th:classappend="${dailyLogDto.status?.name() eq 'DONE'} ? 'row-done' : ''">

                <td class="check-cell">
                    <input type="checkbox"
                           class="custom-check"
                           th:checked="${dailyLogDto.status?.name() eq 'DONE'}"
                           onchange="toggleStatus(this)">
                </td>

                <td>
                    <span class="routine-name" th:text="${dailyLogDto.title}">루틴명</span>
                </td>

                <td class="value-cell">
                    <!-- 체크형: 고정 텍스트 -->
                    <span th:if="${dailyLogDto.routineType?.name() eq 'CHECK'}">
                        <span class="check-label">완료 1회</span>
                        <input type="hidden" class="achieved-value" value="1">
                    </span>
                    <!-- 누적형 횟수: 정수만 -->
                    <span th:if="${dailyLogDto.routineType?.name() eq 'COUNT'}">
                        <input type="number"
                               class="achieved-value"
                               data-value-type="COUNT"
                               th:value="${dailyLogDto.achievedValue}"
                               th:disabled="${dailyLogDto.status?.name() eq 'DONE'}"
                               oninput="sanitizeAchievedInput(this)"
                               min="1" step="1" inputmode="numeric">
                        <span class="value-unit">회</span>
                    </span>
                    <!-- 시간: 분 단위, 정수만 -->
                    <span th:if="${dailyLogDto.routineType?.name() eq 'TIME'}">
                        <input type="number"
                               class="achieved-value"
                               data-value-type="TIME"
                               th:value="${dailyLogDto.achievedValue}"
                               th:disabled="${dailyLogDto.status?.name() eq 'DONE'}"
                               oninput="sanitizeAchievedInput(this)"
                               min="1" step="1" inputmode="numeric">
                        <span class="value-unit">분</span>
                    </span>
                    <!-- km: 소수점 둘째 자리까지 -->
                    <span th:if="${dailyLogDto.routineType?.name() eq 'KM'}">
                        <input type="number"
                               class="achieved-value"
                               data-value-type="KM"
                               th:value="${dailyLogDto.achievedValue}"
                               th:disabled="${dailyLogDto.status?.name() eq 'DONE'}"
                               oninput="sanitizeAchievedInput(this)"
                               min="0.01" step="0.01" inputmode="decimal">
                        <span class="value-unit">km</span>
                    </span>
                </td>
            </tr>

            </tbody>
        </table>
    </div>

</div><!-- /.page-wrapper -->


<script>
    // ─── 테마 토글 ───────────────────────────────
    (function initTheme() {
        const saved = localStorage.getItem('theme');
        if (saved) document.documentElement.setAttribute('data-theme', saved);
        updateThemeIcon();
    })();

    function toggleTheme() {
        const html    = document.documentElement;
        const current = html.getAttribute('data-theme');
        const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        let next;
        if (!current) {
            next = sysDark ? 'light' : 'dark';
        } else {
            next = current === 'dark' ? 'light' : 'dark';
        }
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateThemeIcon();
    }

    function updateThemeIcon() {
        const btn     = document.getElementById('themeToggle');
        if (!btn) return;
        const html    = document.documentElement;
        const current = html.getAttribute('data-theme');
        const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark  = current === 'dark' || (!current && sysDark);
        btn.textContent = isDark ? '☀️' : '🌙';
        btn.title       = isDark ? '라이트 모드로 전환' : '다크 모드로 전환';
    }

    // ─── 프로필 드롭다운 ─────────────────────────
    function toggleProfileMenu(event) {
        event.stopPropagation();
        document.getElementById('profileDropdown').classList.toggle('open');
        document.getElementById('profileBtn').classList.toggle('active');
    }

    document.addEventListener('click', (event) => {
        const profile = document.querySelector('.user-profile');
        if (profile && !profile.contains(event.target)) {
            document.getElementById('profileDropdown').classList.remove('open');
            document.getElementById('profileBtn').classList.remove('active');
        }
    });

    async function logout() {
        await fetch('/api/members/logout', { method: 'POST' });
        window.location.href = '/login';
    }

    // ─── 어드민: 데몬 수동 실행 ───────────────────
    async function runDaemon(daemonName, path) {
        if (!(await showConfirm(daemonName + '를 지금 수동으로 실행할까요?'))) return;

        try {
            const response = await fetch('/admin/daemon/' + path, { method: 'POST' });
            const message  = await response.text();
            if (!response.ok) throw new Error(message);
            showAlert(message);
        } catch (error) {
            console.error('Daemon run failed:', error);
            showAlert(daemonName + ' 실행 중 오류가 발생했어요: ' + error.message);
        }
    }

    // ─── 통계 초기값 ─────────────────────────────
    let totalCount     = parseInt(document.getElementById('totalCountView').innerText)     || 0;
    let completedCount = parseInt(document.getElementById('completedCountView').innerText) || 0;

    // ─── 달성 수치 입력 제한 (루틴 타입별) ────────
    function sanitizeAchievedInput(input) {
        const type = input.dataset.valueType;
        let value = input.value;

        if (type === 'KM') {
            // 숫자와 소수점 하나만, 소수점 이하 2자리까지
            value = value.replace(/[^0-9.]/g, '');
            const parts = value.split('.');
            if (parts.length > 2) value = parts[0] + '.' + parts.slice(1).join('');
            const dotIndex = value.indexOf('.');
            if (dotIndex !== -1 && value.length - dotIndex - 1 > 2) {
                value = value.slice(0, dotIndex + 3);
            }
        } else {
            // COUNT, TIME: 정수만
            value = value.replace(/[^0-9]/g, '');
        }

        input.value = value;
    }

    // 화면에 보여주는 값(km 등) -> 백엔드로 보낼 저장 단위(미터, 분 등)로 변환
    function toAchievedValue(displayValue, valueType) {
        if (valueType === 'KM') {
            return Math.round(parseFloat(displayValue || 0) * 1000);
        }
        return parseInt(displayValue || '0', 10);
    }

    // ─── 체크박스 토글 ───────────────────────────
    async function toggleStatus(checkbox) {
        const tr        = checkbox.closest('tr');
        const seqNo     = tr.getAttribute('data-seq-no');
        const isChecked = checkbox.checked;
        const status    = isChecked ? 'DONE' : 'TODO';
        const inputEl   = tr.querySelector('.achieved-value');
        const valueType = inputEl ? inputEl.dataset.valueType : null;

        const originalValue = inputEl ? inputEl.value : 0;

        if (isChecked && (!originalValue || parseFloat(originalValue) <= 0)) {
            showAlert('오늘 달성한 수치를 입력해야 해요!');
            checkbox.checked = false;
            return;
        }

        const targetAchievedValue = isChecked ? originalValue : 0;

        // 낙관적 업데이트
        tr.classList.toggle('row-done', isChecked);
        if (inputEl && inputEl.type === 'number') {
            inputEl.disabled = isChecked;
            if (!isChecked) inputEl.value = 0;
        }
        updateStatsUI(isChecked ? 1 : -1);

        try {
            const response = await fetch('/api/routine/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    seqNo:         seqNo,
                    status:        status,
                    achievedValue: toAchievedValue(targetAchievedValue, valueType)
                })
            });
            if (!response.ok) throw new Error('API update failed');

        } catch (error) {
            console.error('Update failed:', error);
            showAlert('서버와 통신하는 데 문제가 발생했어요. 되돌릴게요!');

            // 롤백
            checkbox.checked = !isChecked;
            tr.classList.toggle('row-done', !isChecked);
            if (inputEl && inputEl.type === 'number') {
                inputEl.disabled = !isChecked;
                inputEl.value    = originalValue;
            }
            updateStatsUI(!isChecked ? 1 : -1);
        }
    }

    function updateStatsUI(changeCount) {
        if (totalCount === 0) return;
        completedCount = Math.max(0, Math.min(totalCount, completedCount + changeCount));
        const rate = Math.round((completedCount / totalCount) * 100);
        document.getElementById('completedCountView').innerText   = completedCount;
        document.getElementById('achievementRateView').innerText  = rate + '%';
    }
</script>

</body>
</html>
