<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>루틴 설정</title>
    <link rel="stylesheet" th:href="@{/css/routine.css}" href="/css/routine.css">
</head>
<body>

<div class="page-wrapper">

    <!-- ── Top Navigation ── -->
    <nav class="top-nav">
        <div class="nav-tabs">
            <button type="button" class="nav-btn" onclick="location.href='/dailyLog'">일일 루틴</button>
            <button type="button" class="nav-btn" onclick="location.href='/routineCycleStatus'">루틴 현황</button>
            <button type="button" class="nav-btn active">루틴 설정</button>
        </div>
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="테마 전환">🌙</button>
    </nav>

    <!-- ══════════════════════════
         새로운 루틴 등록 폼
    ══════════════════════════ -->
    <h2 class="section-title">새로운 루틴 등록</h2>

    <div class="form-card">

        <!-- 1. 루틴명 -->
        <div class="field-row">
            <span class="field-label">루틴명</span>
            <div class="field-content">
                <input type="text" id="title" placeholder="예: 아침 조깅">
            </div>
        </div>

        <!-- 2. 수행 요일 -->
        <div class="field-row">
            <span class="field-label">수행 요일</span>
            <div class="field-content">
                <div class="days-row">
                    <label class="day-chip any-day">
                        <input type="checkbox" id="checkAnyDay" onchange="onAnyDayChange()" checked>
                        매일
                    </label>
                    <span class="sep"></span>
                    <label class="day-chip"><input type="checkbox" class="day-checkbox" value="1" onchange="onDayCheckboxChange()" checked>월</label>
                    <label class="day-chip"><input type="checkbox" class="day-checkbox" value="2" onchange="onDayCheckboxChange()" checked>화</label>
                    <label class="day-chip"><input type="checkbox" class="day-checkbox" value="3" onchange="onDayCheckboxChange()" checked>수</label>
                    <label class="day-chip"><input type="checkbox" class="day-checkbox" value="4" onchange="onDayCheckboxChange()" checked>목</label>
                    <label class="day-chip"><input type="checkbox" class="day-checkbox" value="5" onchange="onDayCheckboxChange()" checked>금</label>
                    <label class="day-chip"><input type="checkbox" class="day-checkbox" value="6" onchange="onDayCheckboxChange()" checked>토</label>
                    <label class="day-chip"><input type="checkbox" class="day-checkbox" value="7" onchange="onDayCheckboxChange()" checked>일</label>
                </div>
            </div>
        </div>

        <!-- 3. 루틴 타입 -->
        <div class="field-row">
            <span class="field-label">루틴 타입</span>
            <div class="field-content">
                <div class="type-options">
                    <label class="type-chip">
                        <input type="radio" name="routineType" value="CHECK" onchange="onTypeChange()" checked>
                        체크형 횟수 <small>[1일 1회]</small>
                    </label>
                    <label class="type-chip">
                        <input type="radio" name="routineType" value="COUNT" onchange="onTypeChange()">
                        누적형 횟수 <small>[1일 N회]</small>
                    </label>
                    <label class="type-chip">
                        <input type="radio" name="routineType" value="TIME" onchange="onTypeChange()">
                        시간
                    </label>
                    <label class="type-chip">
                        <input type="radio" name="routineType" value="KM" onchange="onTypeChange()">
                        km
                    </label>
                </div>
            </div>
        </div>

        <!-- 4. 주간 목표 수치 -->
        <div class="field-row">
            <span class="field-label">주간 목표</span>
            <div class="field-content" id="goalCell">

                <!-- 체크형 -->
                <div id="goal-CHECK" class="goal-block visible">
                    <div class="goal-main">
                        <input type="number" id="checkGoal" min="1" value="1">
                        <span class="unit">회 / 주</span>
                        <span class="check-max-hint" id="checkMaxHint">(최대 7회)</span>
                    </div>
                    <div class="error-msg" id="checkGoalError">선택한 요일 수를 초과할 수 없어요.</div>
                </div>

                <!-- 누적형 -->
                <div id="goal-COUNT" class="goal-block">
                    <div class="goal-main">
                        <input type="number" id="countGoal" min="1" value="10">
                        <span class="unit">회 / 주</span>
                        <button type="button" class="toggle-limit-btn" onclick="toggleLimit('COUNT')">1일 최대 한도 설정</button>
                    </div>
                    <div class="daily-limit-area" id="limit-COUNT">
                        <span class="limit-label">1일 최대</span>
                        <input type="number" id="countLimit" min="1" value="1">
                        <span class="unit">회</span>
                    </div>
                    <div class="error-msg" id="countLimitError">1일 최대 한도가 주간 목표보다 클 수 없어요.</div>
                </div>

                <!-- 시간 -->
                <div id="goal-TIME" class="goal-block">
                    <div class="goal-main">
                        <input type="number" class="input-sm" id="timeGoalHour" min="0" value="1">
                        <span class="unit">시간</span>
                        <input type="number" class="input-sm" id="timeGoalMin" min="0" max="59" value="0">
                        <span class="unit">분 / 주</span>
                        <button type="button" class="toggle-limit-btn" onclick="toggleLimit('TIME')">1일 최대 한도 설정</button>
                    </div>
                    <div class="daily-limit-area" id="limit-TIME">
                        <span class="limit-label">1일 최대</span>
                        <input type="number" class="input-sm" id="timeLimitHour" min="0" value="0">
                        <span class="unit">시간</span>
                        <input type="number" class="input-sm" id="timeLimitMin" min="0" max="59" value="30">
                        <span class="unit">분</span>
                    </div>
                    <div class="error-msg" id="timeLimitError">1일 최대 한도가 주간 목표보다 클 수 없어요.</div>
                </div>

                <!-- km -->
                <div id="goal-KM" class="goal-block">
                    <div class="goal-main">
                        <input type="number" id="distGoal" min="0.01" step="0.01" value="5.00" style="width:90px;">
                        <span class="unit">km / 주</span>
                        <button type="button" class="toggle-limit-btn" onclick="toggleLimit('KM')">1일 최대 한도 설정</button>
                    </div>
                    <div class="daily-limit-area" id="limit-KM">
                        <span class="limit-label">1일 최대</span>
                        <input type="number" id="distLimit" min="0.01" step="0.01" value="1.00" style="width:90px;">
                        <span class="unit">km</span>
                    </div>
                    <div class="error-msg" id="distLimitError">1일 최대 한도가 주간 목표보다 클 수 없어요.</div>
                </div>

            </div>
        </div>

        <!-- 5. 시작 주 -->
        <div class="field-row">
            <span class="field-label">시작 주</span>
            <div class="field-content">
                <input type="week" id="startYmd">
                <span class="input-hint">* 기본값: 이번 주</span>
            </div>
        </div>

        <input type="hidden" id="intervalWeeks" value="1">

        <button type="button" class="btn-submit" onclick="saveRoutine()">루틴 등록하기</button>
    </div>

    <!-- ══════════════════════════
         등록된 루틴 리스트
    ══════════════════════════ -->
    <hr class="divider">
    <h2 class="section-title">등록된 루틴 리스트</h2>

    <div class="list-card">
        <table class="routine-table">
            <thead>
            <tr>
                <th>루틴명</th>
                <th>타입</th>
                <th>주간 목표</th>
                <th>1일 최대</th>
                <th class="col-hide-sm">수행 요일</th>
                <th class="col-hide-sm">시작 주</th>
            </tr>
            </thead>
            <tbody id="routineListBody">

            <tr th:if="${#lists.isEmpty(routineSettingDtoList)}" id="emptyMessageRow">
                <td colspan="6">
                    <div class="empty-state">
                        <span class="empty-icon">📋</span>
                        등록된 루틴이 없어요. 첫 루틴을 등록해 보세요!
                    </div>
                </td>
            </tr>

            <tr th:unless="${#lists.isEmpty(routineSettingDtoList)}" th:each="routineSettingDto : ${routineSettingDtoList}">
                <td th:text="${routineSettingDto.title}"></td>
                <td><span class="type-badge" th:text="${routineSettingDto.routineType}"></span></td>
                <td th:text="${routineSettingDto.targetValueView}"></td>
                <td th:text="${routineSettingDto.dailyLimitView}"></td>
                <td class="col-hide-sm" th:text="${routineSettingDto.daysOfWeekView}"></td>
                <td class="col-hide-sm start-week" th:text="${routineSettingDto.startYmd}"></td>
            </tr>

            </tbody>
        </table>
    </div>

</div>


<script>
    // ─── 테마 토글 ───────────────────────────────
    (function initTheme() {
        const saved = localStorage.getItem('theme');
        if (saved) document.documentElement.setAttribute('data-theme', saved);
        updateThemeIcon();
    })();

    function toggleTheme() {
        const html    = document.documentElement;
        const current = html.getAttribute('data-theme');
        const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const next    = (current === 'dark' || (!current && sysDark)) ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateThemeIcon();
    }

    function updateThemeIcon() {
        const btn     = document.getElementById('themeToggle');
        if (!btn) return;
        const html    = document.documentElement;
        const current = html.getAttribute('data-theme');
        const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark  = current === 'dark' || (!current && sysDark);
        btn.textContent = isDark ? '☀️' : '🌙';
        btn.title       = isDark ? '라이트 모드로 전환' : '다크 모드로 전환';
    }

    // ─── 페이지 초기화 ───────────────────────────
    window.onload = function () {
        document.getElementById('startYmd').value = getISOWeekString(new Date());
        updateCheckMaxHint();
    };

    // ─── 요일 체크박스 ───────────────────────────
    function onAnyDayChange() {
        const isChecked = document.getElementById('checkAnyDay').checked;
        document.querySelectorAll('.day-checkbox').forEach(cb => cb.checked = isChecked);
        updateCheckMaxHint();
    }
    function onDayCheckboxChange() {
        const all     = document.querySelectorAll('.day-checkbox');
        const checked = document.querySelectorAll('.day-checkbox:checked');
        document.getElementById('checkAnyDay').checked = (all.length === checked.length);
        updateCheckMaxHint();
    }
    function getSelectedDayCount() { return document.querySelectorAll('.day-checkbox:checked').length; }
    function getSelectedDaysStr() {
        const vals = [];
        document.querySelectorAll('.day-checkbox:checked').forEach(cb => vals.push(cb.value));
        return vals.join(',');
    }

    // ─── 루틴 타입 ───────────────────────────────
    function onTypeChange() {
        document.querySelectorAll('.goal-block').forEach(el => el.classList.remove('visible'));
        document.getElementById('goal-' + getSelectedType()).classList.add('visible');
        clearErrors();
    }
    function getSelectedType() {
        return document.querySelector('input[name="routineType"]:checked').value;
    }

    // ─── 체크형 힌트 ─────────────────────────────
    function updateCheckMaxHint() {
        const cnt = getSelectedDayCount();
        document.getElementById('checkMaxHint').textContent = '(최대 ' + cnt + '회)';
        const input = document.getElementById('checkGoal');
        input.max = cnt;
        if (parseInt(input.value) > cnt) input.value = cnt;
    }

    // ─── 한도 토글 ───────────────────────────────
    function toggleLimit(type) {
        document.getElementById('limit-' + type).classList.toggle('open');
    }

    // ─── 유효성 검사 ─────────────────────────────
    function clearErrors() {
        document.querySelectorAll('.error-msg').forEach(el => el.classList.remove('visible'));
    }
    function showError(id) { document.getElementById(id).classList.add('visible'); }
    function toMinutes(h, m) { return parseInt(h || 0) * 60 + parseInt(m || 0); }
    function toMeters(km)    { return Math.round(parseFloat(km || 0) * 1000); }

    function validate(type) {
        clearErrors();
        if (type === 'CHECK') {
            const val = parseInt(document.getElementById('checkGoal').value);
            const max = getSelectedDayCount();
            if (!val || val < 1 || val > max) { showError('checkGoalError'); return false; }
        }
        if (type === 'COUNT') {
            const goal = parseInt(document.getElementById('countGoal').value);
            if (!goal || goal < 1) { showError('countLimitError'); return false; }
            if (document.getElementById('limit-COUNT').classList.contains('open')) {
                const limit = parseInt(document.getElementById('countLimit').value);
                if (limit && limit > goal) { showError('countLimitError'); return false; }
            }
        }
        if (type === 'TIME') {
            const goalMin = toMinutes(document.getElementById('timeGoalHour').value, document.getElementById('timeGoalMin').value);
            if (goalMin < 1) { showError('timeLimitError'); return false; }
            if (document.getElementById('limit-TIME').classList.contains('open')) {
                const lm = toMinutes(document.getElementById('timeLimitHour').value, document.getElementById('timeLimitMin').value);
                if (lm > goalMin) { showError('timeLimitError'); return false; }
            }
        }
        if (type === 'KM') {
            const goal = parseFloat(document.getElementById('distGoal').value);
            if (!goal || goal <= 0) { showError('distLimitError'); return false; }
            if (document.getElementById('limit-KM').classList.contains('open')) {
                const limit = parseFloat(document.getElementById('distLimit').value);
                if (limit && limit > goal) { showError('distLimitError'); return false; }
            }
        }
        return true;
    }

    // ─── 요청 데이터 빌드 ────────────────────────
    function buildRequestData(type) {
        const daysStr  = getSelectedDaysStr();
        const startYmd = getMondayFromWeekStr(document.getElementById('startYmd').value);
        let targetValue = null, dailyLimit = 0;
        if (type === 'CHECK') {
            targetValue = parseInt(document.getElementById('checkGoal').value);
            dailyLimit = 1;
        }
        if (type === 'COUNT') {
            targetValue = parseInt(document.getElementById('countGoal').value);
            if (document.getElementById('limit-COUNT').classList.contains('open'))
                dailyLimit = parseInt(document.getElementById('countLimit').value) || null;
        }
        if (type === 'TIME') {
            targetValue = toMinutes(document.getElementById('timeGoalHour').value, document.getElementById('timeGoalMin').value);
            if (document.getElementById('limit-TIME').classList.contains('open')) {
                const lm = toMinutes(document.getElementById('timeLimitHour').value, document.getElementById('timeLimitMin').value);
                if (lm > 0) dailyLimit = lm;
            }
        }
        if (type === 'KM') {
            targetValue = toMeters(document.getElementById('distGoal').value);
            if (document.getElementById('limit-KM').classList.contains('open')) {
                const lm = toMeters(document.getElementById('distLimit').value);
                if (lm > 0) dailyLimit = lm;
            }
        }
        return { title: document.getElementById('title').value.trim(), routineType: type,
            intervalWeeks: document.getElementById('intervalWeeks').value, targetValue, dailyLimit, daysOfWeek: daysStr, startYmd };
    }

    // ─── 저장 ────────────────────────────────────
    async function saveRoutine() {
        const title = document.getElementById('title').value.trim();
        if (!title) { alert('루틴명을 입력해 줘!'); return; }
        if (getSelectedDayCount() === 0) { alert('수행할 요일을 하나 이상 선택해 줘!'); return; }
        const type = getSelectedType();
        if (!validate(type)) return;
        const requestData = buildRequestData(type);
        try {
            const response = await fetch('/api/routine/save', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(requestData)
            });
            if (response.ok) { addRoutineToList(requestData); alert('루틴이 등록됐어!'); resetForm(); }
            else alert('등록에 실패했어. 다시 시도해 봐.');
        } catch (e) { console.error(e); }
    }

    // ─── 폼 초기화 ───────────────────────────────
    function resetForm() {
        document.getElementById('title').value = '';
        document.getElementById('checkAnyDay').checked = true;
        onAnyDayChange();
        document.querySelector('input[name="routineType"][value="CHECK"]').checked = true;
        onTypeChange();
        document.getElementById('startYmd').value = getISOWeekString(new Date());
        clearErrors();
    }

    // ─── 목록 행 추가 ─────────────────────────────
    function addRoutineToList(data) {
        const tbody = document.getElementById('routineListBody');
        const empty = document.getElementById('emptyMessageRow');
        if (empty) empty.remove();
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${data.title}</td>
            <td><span class="type-badge">${typeLabel(data.routineType)}</span></td>
            <td>${formatGoal(data.routineType, data.targetValue)}</td>
            <td>${data.dailyLimit ? formatGoal(data.routineType, data.dailyLimit) : '-'}</td>
            <td class="col-hide-sm">${convertToDays(data.daysOfWeek)}</td>
            <td class="col-hide-sm start-week">${data.startYmd}</td>
        `;
        tbody.insertBefore(tr, tbody.firstChild);
    }

    function typeLabel(t) { return { CHECK:'체크형', COUNT:'누적형', TIME:'시간', KM:'km' }[t] || t; }
    function formatGoal(type, value) {
        if (type === 'CHECK' || type === 'COUNT') return value + '회';
        if (type === 'TIME') { const h = Math.floor(value/60), m = value%60; return (h>0?h+'시간 ':'')+m+'분'; }
        if (type === 'KM') return (value/1000).toFixed(2)+'km';
        return value;
    }
    function convertToDays(str) {
        // 1. 공백을 제거하고 오름차순으로 정렬한 뒤 하나의 문자열로 합칩니다. (예: " 5, 1,2 " -> "125")
        const normalizedStr = str.split(',')
            .map(n => n.trim())
            .sort()
            .join('');

        // 2. 조건에 따른 특별한 문자열 리턴
        if (normalizedStr === '1234567') return '매일';
        if (normalizedStr === '12345') return '평일';
        if (normalizedStr === '67') return '주말';

        // 3. 위 조건에 해당하지 않는 경우 기존처럼 개별 요일로 매핑
        const map = {'1':'월','2':'화','3':'수','4':'목','5':'금','6':'토','7':'일'};
        const days = str.split(',').map(n => map[n.trim()] || n.trim());

        return days.join(', ');
    }

    // ─── ISO 주차 유틸 ───────────────────────────
    function getISOWeekString(date) {
        const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
        const day = d.getUTCDay() || 7;
        d.setUTCDate(d.getUTCDate() + 4 - day);
        const y = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
        const w = Math.ceil((((d - y) / 86400000) + 1) / 7);
        return d.getUTCFullYear() + '-W' + String(w).padStart(2, '0');
    }
    function getMondayFromWeekStr(weekStr) {
        if (!weekStr) return null;
        const year = parseInt(weekStr.substring(0, 4));
        const week = parseInt(weekStr.substring(6, 8));
        const jan4 = new Date(year, 0, 4);
        const firstMonday = new Date(year, 0, 4 - (jan4.getDay()||7) + 1);
        const target = new Date(firstMonday.getTime() + (week-1)*7*86400000);
        return `${target.getFullYear()}-${String(target.getMonth()+1).padStart(2,'0')}-${String(target.getDate()).padStart(2,'0')}`;
    }
</script>

</body>
</html>
