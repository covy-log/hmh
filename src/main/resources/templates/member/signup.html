<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link rel="icon" type="image/png" media="(prefers-color-scheme: light)" href="/img/hmh_favicon_black.png">
    <link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="/img/hmh_favicon_light.png">
    <link rel="stylesheet" href="/css/routine.css">
    <script src="/js/dialog.js"></script>
    <style>
        /* 회원가입 페이지 전용 스타일 */
        .auth-container {
            /* 하단 공통 푸터가 화면 밖으로 밀리지 않도록 푸터 높이만큼 뺀다 */
            min-height: calc(100vh - 96px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .auth-box {
            width: 100%;
            max-width: 480px;
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .auth-title {
            font-family: var(--font-label);
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        
        .auth-subtitle {
            font-size: 14px;
            color: var(--text-hint);
        }
        
        .auth-form {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px 28px;
            box-shadow: var(--shadow-md);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group:last-of-type {
            margin-bottom: 0;
        }
        
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-family: var(--font-label);
        }
        
        .radio-group {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        
        .radio-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
            transition: color var(--transition);
        }
        
        .radio-label:hover {
            color: var(--accent);
        }
        
        .radio-label input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-radius: 50%;
            background: var(--surface-sub);
            cursor: pointer;
            position: relative;
            transition: all var(--transition);
        }
        
        .radio-label input[type="radio"]:hover {
            border-color: var(--accent);
        }
        
        .radio-label input[type="radio"]:checked {
            border-color: var(--accent);
            background: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        
        .radio-label input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #fff;
        }
        
        .radio-label input[type="radio"]:checked + span {
            color: var(--accent);
            font-weight: 600;
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border-soft);
        }
        
        .auth-link {
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color var(--transition);
        }
        
        .auth-link:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }
        
        .auth-text {
            color: var(--text-secondary);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1 class="auth-title">회원가입</h1>
                <p class="auth-subtitle">새로운 계정을 만드세요</p>
            </div>
            
            <div class="auth-form">
                <div class="form-group">
                    <label class="form-label" for="loginId">아이디</label>
                    <input type="text" id="loginId" class="form-input" placeholder="사용할 아이디를 입력하세요">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">비밀번호</label>
                    <input type="password" id="password" class="form-input" placeholder="비밀번호를 입력하세요">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="name">이름</label>
                    <input type="text" id="name" class="form-input" placeholder="이름 또는 닉네임을 입력하세요">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="email">이메일</label>
                    <input type="email" id="email" class="form-input" placeholder="이메일 주소를 입력하세요">
                </div>
                
                <!-- 주 시작 요일: 아직 비공개 기능이라 숨김 처리. 회원별 설정 기능 붙일 때 다시 노출 예정
                <div class="form-group">
                    <label class="form-label">주 시작 요일</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="weekStartDay" value="1" checked>
                            <span>월요일</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="weekStartDay" value="7">
                            <span>일요일</span>
                        </label>
                    </div>
                </div>
                -->

                <button class="btn-submit" onclick="signup()" style="margin-top: 24px;">가입하기</button>
            </div>
            
            <div class="auth-footer">
                <span class="auth-text">이미 계정이 있으신가요? </span>
                <a href="/login" class="auth-link">로그인 하러가기</a>
            </div>
        </div>
    </div>

    <script>
        async function signup() {
            // 1. 입력된 값 가져오기
            const loginId = document.getElementById('loginId').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value
            const weekStartDay = "1"; // 주 시작 요일 선택 UI는 비공개 처리, 우선 월요일 고정

            // 2. 서버로 JSON 데이터 전송
            const response = await fetch('/api/members/join', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    loginId: loginId,
                    password: password,
                    name: name,
                    email: email,
                    weekStartDay: weekStartDay
                })
            });

            // 3. 결과 처리
            if (response.status === 201) { // 컨트롤러에서 설정한 HttpStatus.CREATED
                await showAlert('회원가입이 완료되었습니다! 로그인 해주세요.');
                window.location.href = 'login.html'; // 가입 성공 시 로그인 페이지로 강제 이동
            } else {
                const errorMessage = await response.text();
                showAlert('회원가입 실패: ' + errorMessage);
            }
        }
    </script>

<div th:replace="~{fragments/footer :: siteFooter}"></div>

</body>
</html>
