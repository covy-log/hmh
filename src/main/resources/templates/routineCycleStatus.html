<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>루틴 현황</title>
    <link rel="stylesheet" th:href="@{/css/routine.css}" href="/css/routine.css">
    <script th:src="@{/js/dialog.js}" src="/js/dialog.js"></script>
</head>
<body>

<div class="page-wrapper">

    <!-- ── User Bar ── -->
    <div class="user-bar">
        <div class="user-profile">
            <span class="user-name" th:text="${name}">이름</span>
            <button type="button" class="profile-btn" id="profileBtn" onclick="toggleProfileMenu(event)" title="마이페이지">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/>
                    <path d="M4 20c0-4 3.582-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <div class="profile-dropdown" id="profileDropdown">
                <button type="button" class="dropdown-item" disabled>마이페이지</button>
                <button type="button" class="dropdown-item" th:if="${isAdmin}" onclick="location.href='/admin'">관리 페이지</button>
                <button type="button" class="dropdown-item" th:if="${isAdmin}" onclick="runDaemon('RoutineCycleDaemon', 'routine-cycle')">RoutineCycleDaemon 실행</button>
                <button type="button" class="dropdown-item" th:if="${isAdmin}" onclick="runDaemon('DailyLogDaemon', 'daily-log')">DailyLogDaemon 실행</button>
                <button type="button" class="dropdown-item" onclick="logout()">로그아웃</button>
            </div>
        </div>
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="테마 전환">🌙</button>
    </div>

    <!-- ── Top Navigation ── -->
    <nav class="top-nav">
        <div class="nav-tabs">
            <button type="button" class="nav-btn" onclick="location.href='/dailyLog'">일일 루틴</button>
            <button type="button" class="nav-btn active">루틴 현황</button>
            <button type="button" class="nav-btn" onclick="location.href='/routineSetting'">루틴 설정</button>
        </div>
    </nav>

    <!-- ── Current Cycle Progress ── -->
    <h2 class="section-title">이번 주기 달성 현황</h2>

    <div class="list-card">
        <table class="routine-table">
            <thead>
            <tr>
                <th>루틴명</th>
                <th class="progress-cell">진행률</th>
                <th>현재 / 목표</th>
            </tr>
            </thead>
            <tbody>

            <tr th:if="${#lists.isEmpty(routineCycleStatusDtoList)}">
                <td colspan="3">
                    <div class="empty-state">
                        <span class="empty-icon">📈</span>
                        진행 중인 루틴이 없어요.<br>
                        <b>'루틴 설정'</b> 탭에서 새로운 루틴을 등록해 보세요.
                    </div>
                </td>
            </tr>

            <tr th:unless="${#lists.isEmpty(routineCycleStatusDtoList)}" th:each="status : ${routineCycleStatusDtoList}">
                <td>
                    <span class="routine-name" th:text="${status.title}">루틴 이름</span>
                </td>
                <td class="progress-cell">
                    <div class="progress-wrapper">
                        <div class="progress-track">
                            <div class="progress-fill"
                                 th:classappend="${status.progressPercent >= 100} ? 'complete' : ''"
                                 th:style="'width: ' + ${status.progressPercent} + '%;'"></div>
                        </div>
                        <span class="progress-percent" th:text="${status.progressPercent} + '%'">0%</span>
                    </div>
                </td>
                <td>
                    <span class="value-compare">
                        <span th:text="${status.currentValueView}">0</span> / <span th:text="${status.targetValueView}">0</span>
                    </span>
                </td>
            </tr>

            </tbody>
        </table>
    </div>

    <!-- ── History ── -->
    <h2 class="section-title">루틴 수행 히스토리</h2>

    <div class="list-card">
        <table class="routine-table">
            <thead>
            <tr>
                <th>날짜</th>
                <th>루틴명</th>
                <th>수행 결과</th>
                <th class="status-cell">상태</th>
            </tr>
            </thead>
            <tbody>

            <tr th:if="${#lists.isEmpty(dailyLogHistoryDtoList)}">
                <td colspan="4">
                    <div class="empty-state">
                        <span class="empty-icon">🗒️</span>
                        아직 기록된 히스토리가 없어요.<br>
                        루틴을 완료해서 기록을 쌓아보세요!
                    </div>
                </td>
            </tr>

            <tr th:unless="${#lists.isEmpty(dailyLogHistoryDtoList)}" th:each="history : ${dailyLogHistoryDtoList}">
                <td class="start-week" th:text="${history.todoYmd}">2026-04-03</td>

                <td>
                    <span class="routine-name" th:text="${history.title}">아침 조깅</span>
                </td>

                <td>
                    <span th:text="${history.resultValueView}">5km</span>
                    <span class="value-unit">/ <span th:text="${history.targetValueView}">5km</span></span>
                </td>

                <td class="status-cell">
                    <span th:if="${history.success}" class="status-badge success">성공</span>
                    <span th:unless="${history.success}" class="status-badge fail">미달</span>
                </td>
            </tr>

            </tbody>
        </table>
    </div>

</div><!-- /.page-wrapper -->

<script>
    // ─── 테마 토글 ───────────────────────────────
    (function initTheme() {
        const saved = localStorage.getItem('theme');
        if (saved) document.documentElement.setAttribute('data-theme', saved);
        updateThemeIcon();
    })();

    function toggleTheme() {
        const html    = document.documentElement;
        const current = html.getAttribute('data-theme');
        const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const next    = (current === 'dark' || (!current && sysDark)) ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateThemeIcon();
    }

    function updateThemeIcon() {
        const btn     = document.getElementById('themeToggle');
        if (!btn) return;
        const html    = document.documentElement;
        const current = html.getAttribute('data-theme');
        const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark  = current === 'dark' || (!current && sysDark);
        btn.textContent = isDark ? '☀️' : '🌙';
        btn.title       = isDark ? '라이트 모드로 전환' : '다크 모드로 전환';
    }

    // ─── 프로필 드롭다운 ─────────────────────────
    function toggleProfileMenu(event) {
        event.stopPropagation();
        document.getElementById('profileDropdown').classList.toggle('open');
        document.getElementById('profileBtn').classList.toggle('active');
    }

    document.addEventListener('click', (event) => {
        const profile = document.querySelector('.user-profile');
        if (profile && !profile.contains(event.target)) {
            document.getElementById('profileDropdown').classList.remove('open');
            document.getElementById('profileBtn').classList.remove('active');
        }
    });

    async function logout() {
        await fetch('/api/members/logout', { method: 'POST' });
        window.location.href = '/login';
    }

    // ─── 어드민: 데몬 수동 실행 ───────────────────
    async function runDaemon(daemonName, path) {
        if (!(await showConfirm(daemonName + '를 지금 수동으로 실행할까요?'))) return;

        try {
            const response = await fetch('/admin/daemon/' + path, { method: 'POST' });
            const message  = await response.text();
            if (!response.ok) throw new Error(message);
            showAlert(message);
        } catch (error) {
            console.error('Daemon run failed:', error);
            showAlert(daemonName + ' 실행 중 오류가 발생했어요: ' + error.message);
        }
    }
</script>

</body>
</html>
